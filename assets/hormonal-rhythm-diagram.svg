<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 780" role="img" aria-labelledby="title description">
  <title id="title">Cross-species hormonal rhythm diagram</title>
  <desc id="description">An abstract systems diagram showing solar input coupling distinct monarch and human endocrine rhythms to a shared computational field.</desc>
  <defs>
    <radialGradient id="sun" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#fff4c7"/>
      <stop offset=".34" stop-color="#ffd381"/>
      <stop offset=".72" stop-color="#f5a53e"/>
      <stop offset="1" stop-color="#ef6d42" stop-opacity=".1"/>
    </radialGradient>
    <linearGradient id="warm" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffd381"/>
      <stop offset="1" stop-color="#dd3156"/>
    </linearGradient>
    <linearGradient id="cool" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#80c8d6"/>
      <stop offset="1" stop-color="#f7f1e8"/>
    </linearGradient>
    <filter id="glow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="9" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="2"/>
    </filter>
  </defs>

  <g fill="none" stroke-linecap="round" stroke-linejoin="round">
